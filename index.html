<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StrataCraft</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
  #touch{position:fixed;inset:0;z-index:1}
  .ui{position:fixed;z-index:5}
  #tint{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s}
  #hurt{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,rgba(255,0,0,0) 40%,rgba(255,0,0,.55) 100%)}
  #burn{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,rgba(255,120,0,0) 45%,rgba(255,110,0,.5) 100%)}
  #cross{left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;z-index:4}
  #cross:before,#cross:after{content:"";position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 2px #000}
  #cross:before{left:10px;top:0;width:2px;height:22px}
  #cross:after{left:0;top:10px;width:22px;height:2px}
  #cross.mob:before,#cross.mob:after{background:#ff4d4d}

  #top{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:7px}
  .tbtn{min-width:44px;height:42px;padding:0 9px;border-radius:12px;border:2px solid rgba(255,255,255,.35);
    background:rgba(20,24,32,.6);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;white-space:nowrap}
  .tbtn.on{background:rgba(46,160,140,.8);border-color:#7fe3cf}

  #hud{top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));pointer-events:none}
  #hearts{font-size:17px;letter-spacing:1px;text-shadow:0 1px 2px #000;line-height:1}
  #hearts .h{color:#ff3b4a}#hearts .e{color:rgba(0,0,0,.45)}
  #coins{display:inline-block;margin-top:5px;background:rgba(20,24,32,.6);padding:3px 10px;border-radius:10px;font-weight:800;font-size:15px;color:#ffd84a}
  #looking{top:calc(64px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));
    background:rgba(20,24,32,.55);padding:5px 10px;border-radius:10px;font-size:13px;pointer-events:none;display:none}

  #card{top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));
    background:rgba(15,18,26,.88);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;
    display:none;font-size:14px;line-height:1.35;cursor:pointer}
  #card .nm{font-size:18px;font-weight:800;margin-right:8px}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;color:#111;vertical-align:middle}
  #card .fact{margin-top:6px;color:#e6e9ef}

  #hotwrap{bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:min(560px,calc(100vw - 420px));min-width:220px}
  #selname{text-align:center;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000;margin-bottom:4px;pointer-events:none}
  #hotbar{display:flex;gap:4px;overflow-x:auto;padding:5px;background:rgba(20,24,32,.6);border-radius:12px;
    border:2px solid rgba(255,255,255,.2);scrollbar-width:none;touch-action:pan-x}
  #hotbar::-webkit-scrollbar{display:none}
  .slot{flex:0 0 46px;height:46px;border-radius:8px;border:2px solid transparent;background:rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .slot.sel{border-color:#fff;background:rgba(255,255,255,.22)}
  .slot canvas{width:38px;height:38px;image-rendering:pixelated}
  .slot .dot{position:absolute;bottom:2px;right:2px;width:8px;height:8px;border-radius:50%;border:1px solid #000}

  #act{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:190px;height:190px}
  .abtn{position:absolute;width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,255,255,.45);
    background:rgba(20,24,32,.55);color:#fff;font-size:12px;font-weight:800;display:flex;flex-direction:column;
    align-items:center;justify-content:center;line-height:1.1}
  .abtn span{font-size:26px}
  .abtn.down{background:rgba(255,255,255,.35)}
  #bPlace{right:0;top:20px}
  #bBreak{right:88px;top:0}
  #bJump{right:20px;bottom:0}
  #bDown{right:110px;bottom:0;display:none}
  .fly #bDown{display:flex}
  #bTalk{right:calc(20px + env(safe-area-inset-right));bottom:calc(214px + env(safe-area-inset-bottom));height:46px;padding:0 16px;border-radius:23px;
    background:#ffcf4a;color:#222;font-weight:900;font-size:16px;display:none;align-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  #prompt{left:50%;top:calc(50% + 34px);transform:translateX(-50%);background:rgba(15,18,26,.75);padding:5px 12px;border-radius:9px;
    font-size:13px;font-weight:700;pointer-events:none;display:none}

  #joyBase{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(20,24,32,.3);
    position:fixed;z-index:3;display:none;pointer-events:none}
  #joyKnob{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.55);position:fixed;z-index:3;display:none;pointer-events:none}
  #joyHint{left:calc(40px + env(safe-area-inset-left));bottom:calc(40px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;
    border:3px dashed rgba(255,255,255,.25);pointer-events:none;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:rgba(255,255,255,.6);text-align:center}

  #toast{left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(15,18,26,.85);padding:8px 14px;border-radius:10px;
    font-size:14px;font-weight:700;display:none;pointer-events:none;text-align:center;max-width:80vw}

  #modal{inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
  #modal .box{width:min(560px,calc(100vw - 30px));max-height:calc(100vh - 30px);overflow:auto;background:#1a1f2b;border-radius:16px;
    padding:16px 18px;border:2px solid rgba(255,255,255,.2);font-size:14px;line-height:1.45;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #modal h2{margin:0 0 6px;font-size:21px}
  #modal h3{margin:12px 0 4px;font-size:15px;color:#7fe3cf}
  #modal ul{margin:0;padding-left:18px}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .mbtn{flex:1;min-width:110px;height:44px;border-radius:10px;border:none;font-size:15px;font-weight:800;cursor:pointer;color:#111;background:#7fe3cf}
  .mbtn.red{background:#ff8a7a}.mbtn.gray{background:#c9ced8}.mbtn.gold{background:#ffcf4a}
  .say{background:#2a3142;border-radius:12px;padding:10px 12px;margin:8px 0;font-style:italic}
  .item{display:flex;align-items:center;gap:10px;background:#232a39;border-radius:12px;padding:8px 10px;margin-top:8px}
  .item .ic{font-size:28px;width:36px;text-align:center}
  .item .tx{flex:1;font-size:13px}
  .item .tx b{font-size:15px}
  .item .st{font-size:12px;color:#ffd84a;font-weight:700}
  .item .fx{color:#b8c0cf;font-size:12px;margin-top:2px}
  .ibtn{min-width:78px;height:40px;border-radius:10px;border:none;font-weight:900;font-size:14px;background:#ffcf4a;color:#222}
  .ibtn.dis{background:#4a5161;color:#9aa1ad}
  .ibtn.eq{background:#7fe3cf}

  .no-touch #act,.no-touch #joyHint,.no-touch #bTalk{display:none!important}
  @media (orientation:portrait){
    #hotwrap{width:calc(100vw - 16px)}
    #act{bottom:calc(100px + env(safe-area-inset-bottom))}
    #bTalk{bottom:calc(300px + env(safe-area-inset-bottom))}
    #joyHint{bottom:calc(110px + env(safe-area-inset-bottom))}
    .tbtn{min-width:38px;padding:0 6px;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tint"></div><div id="hurt"></div><div id="burn"></div>
<div id="touch"></div>
<div id="cross" class="ui"></div>
<div id="hud" class="ui"><div id="hearts"></div><div id="coins">🪙 0</div></div>
<div id="looking" class="ui"></div>
<div id="top" class="ui">
  <div class="tbtn" id="bWeapon">✊ Fists</div>
  <div class="tbtn" id="bCam">👁 1st</div>
  <div class="tbtn" id="bFly">🪽</div>
  <div class="tbtn" id="bInfo">ℹ️</div>
  <div class="tbtn" id="bMenu">☰</div>
</div>
<div id="card" class="ui"></div>
<div id="hotwrap" class="ui"><div id="selname"></div><div id="hotbar"></div></div>
<div id="joyHint" class="ui">drag here<br>to move</div>
<div id="act" class="ui">
  <div class="abtn" id="bBreak"><span>⛏</span>Hit</div>
  <div class="abtn" id="bPlace"><span>🧱</span>Place</div>
  <div class="abtn" id="bJump"><span>⬆</span>Jump</div>
  <div class="abtn" id="bDown"><span>⬇</span>Down</div>
</div>
<div id="bTalk" class="ui">💬 Talk</div>
<div id="prompt" class="ui"></div>
<div id="joyBase"></div><div id="joyKnob"></div>
<div id="toast" class="ui"></div>
<div id="modal" class="ui"><div class="box" id="mbox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if(!IS_TOUCH) document.body.classList.add('no-touch');
const $ = id => document.getElementById(id);
const rand=Math.random;

// ================= WORLD =================
const W=96, H=48, D=96, CH=16, N=W*H*D;
const NCX=W/CH, NCZ=D/CH;
const SEA=8, SPAWN_H=11;
let world=new Uint8Array(N), meta=new Uint8Array(N), seed=1;
const idx=(x,y,z)=>x+z*W+y*W*D;
const ix_=i=>i%W, iz_=i=>Math.floor(i/W)%D, iy_=i=>Math.floor(i/(W*D));
function get(x,y,z){ if(x<0||y<0||z<0||x>=W||y>=H||z>=D) return 0; return world[idx(x,y,z)]; }
const inB=(x,y,z)=>x>=0&&y>=0&&z>=0&&x<W&&y<H&&z<D;

// ================= TEXTURES =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const T=16, COLS=16, ROWS=4;
const atlas=document.createElement('canvas'); atlas.width=COLS*T; atlas.height=ROWS*T;
const actx=atlas.getContext('2d');
const TILES={}; let tileCount=0;
const cl=v=>v<0?0:v>255?255:v|0;
const mul=(c,f)=>[c[0]*f,c[1]*f,c[2]*f];
const nz=(c,r,a)=>mul(c,1+(r()-0.5)*a);
function paint(id,seed,fn){
  const img=actx.createImageData(T,T); const r=mulberry32(seed);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const c=fn(x,y,r); const i=(y*T+x)*4;
    img.data[i]=cl(c[0]);img.data[i+1]=cl(c[1]);img.data[i+2]=cl(c[2]);img.data[i+3]=c.length>3?c[3]:255;
  }
  actx.putImageData(img,(id%COLS)*T,Math.floor(id/COLS)*T);
}
function makeTile(name,seed,fn){ const id=tileCount++; TILES[name]=id; paint(id,seed,fn); }
const GREEN=[96,160,56], DIRT=[134,96,67];
makeTile('grass_top',1,(x,y,r)=>{let c=nz(GREEN,r,.25); if(r()<.08)c=mul(c,.78); return c;});
function dirtPx(r){let c=nz(DIRT,r,.22); const q=r(); if(q<.06)c=[100,72,50]; else if(q<.09)c=[165,135,105]; return c;}
makeTile('dirt',2,(x,y,r)=>dirtPx(r));
{const rr=mulberry32(33); const fr=[]; for(let i=0;i<T;i++)fr.push(3+Math.floor(rr()*3));
 makeTile('grass_side',3,(x,y,r)=> y<fr[x]? nz(GREEN,r,.25) : dirtPx(r));}
makeTile('sand',4,(x,y,r)=>{let c=nz([219,205,160],r,.12); if(r()<.05)c=[190,175,130]; return c;});
makeTile('clay',5,(x,y,r)=>nz(mul([158,164,178],1+Math.sin(y*0.8)*0.03),r,.06));
makeTile('granite',6,(x,y,r)=>{const q=r(); if(q<.17)return nz([45,42,42],r,.2); if(q<.38)return nz([238,236,230],r,.06); if(q<.55)return nz([214,140,128],r,.1); return nz([196,170,160],r,.1);});
makeTile('basalt',7,(x,y,r)=>{let c=nz([62,62,66],r,.15); if(r()<.04)c=[35,35,38]; return c;});
makeTile('obsidian',8,(x,y,r)=>{const s=Math.sin(x*0.6+y*0.9)+Math.sin(x*0.2-y*0.5); let c=s>1.3?[62,42,92]:nz([20,15,30],r,.3); if(r()<.025)c=[200,190,230]; return c;});
{const rr=mulberry32(91); const holes=[]; for(let i=0;i<14;i++)holes.push([rr()*16,rr()*16,0.7+rr()*1.3]);
 makeTile('pumice',9,(x,y,r)=>{for(const h of holes){if(Math.hypot(x+.5-h[0],y+.5-h[1])<h[2])return nz([140,134,124],r,.1);} return nz([210,205,192],r,.08);});}
makeTile('sandstone',10,(x,y,r)=>{const b=Math.sin(y*0.9+Math.sin(x*0.3)*0.6); return nz(b>0.4?[200,160,100]:b<-0.5?[230,198,140]:[216,180,120],r,.08);});
makeTile('limestone',11,(x,y,r)=>{let c=nz([226,221,200],r,.06); if(r()<.06)c=[190,185,165]; return c;});
{ const id=TILES.limestone, ox=(id%COLS)*T, oy=Math.floor(id/COLS)*T; actx.fillStyle='rgb(165,155,130)';
  [[3,4],[10,9],[6,12]].forEach(([fx,fy])=>{actx.fillRect(ox+fx,oy+fy,3,1);actx.fillRect(ox+fx,oy+fy+1,1,1);actx.fillRect(ox+fx+2,oy+fy+1,1,1);actx.fillRect(ox+fx+1,oy+fy+2,1,1);}); }
makeTile('shale',12,(x,y,r)=>nz((y%3===0)?[62,66,72]:[86,90,96],r,.1));
{const rr=mulberry32(77); const peb=[]; const cols=[[150,150,150],[110,90,70],[220,215,205],[180,120,90],[90,95,100]];
 for(let i=0;i<9;i++)peb.push([rr()*16,rr()*16,1.4+rr()*1.8,cols[Math.floor(rr()*cols.length)]]);
 makeTile('conglomerate',13,(x,y,r)=>{for(const p of peb){const d=Math.hypot(x+.5-p[0],y+.5-p[1]); if(d<p[2])return nz(mul(p[3],d>p[2]-0.8?0.8:1),r,.08);} return nz([176,152,118],r,.12);});}
makeTile('marble',14,(x,y,r)=>{const v=Math.abs(Math.sin(x*0.35+y*0.55+Math.sin(y*0.4)*2)); return v<0.12?nz([150,150,155],r,.08):nz([242,240,236],r,.04);});
makeTile('slate',15,(x,y,r)=>nz(((x+y*2)%5===0)?[58,66,80]:[74,84,100],r,.08));
makeTile('quartzite',16,(x,y,r)=>{let c=nz([236,214,208],r,.12); if(r()<.05)c=[255,252,250]; return c;});
makeTile('gneiss',17,(x,y,r)=>{const s=Math.sin(y*0.85+Math.sin(x*0.45)*1.6); let c=s>0.15?nz([62,56,56],r,.15):nz([216,204,192],r,.08); if(r()<.06)c=[180,120,110]; return c;});
makeTile('quartz',18,(x,y,r)=>{let c=nz([238,232,246],r,.05); if(x===y||x===y+8||x+8===y)c=[255,255,255]; if((x+y)%16===15)c=[205,195,225]; if(r()<.04)c=[250,215,230]; return c;});
makeTile('coal',19,(x,y,r)=>{let c=nz([30,30,33],r,.3); if(r()<.06)c=[110,110,125]; return c;});
makeTile('log_side',20,(x,y,r)=>nz((x%4===0)?[78,58,34]:[104,78,46],r,.15));
makeTile('log_top',21,(x,y,r)=>{const d=Math.hypot(x-7.5,y-7.5); if(d>6.8)return nz([92,68,40],r,.15); return nz(Math.floor(d*1.2)%2?[176,138,82]:[150,112,64],r,.08);});
makeTile('planks',22,(x,y,r)=>{if(y%4===3)return [120,88,50]; let c=nz([182,142,88],r,.1); if((x===2||x===13)&&y%4===1)c=[90,70,45]; return c;});
makeTile('glass',23,(x,y,r)=>{if(x===0||y===0||x===15||y===15)return [205,232,238,255]; if((x-y===3||x-y===4)&&x>3&&x<11)return [240,252,255,255]; return [0,0,0,0];});
makeTile('leaves',24,(x,y,r)=>{const q=r(); if(q<.16)return [0,0,0,0]; let c=nz([58,130,44],r,.35); if(q>.85)c=[40,95,30]; return c;});
const waterFn=ph=>(x,y,r)=>{const w=Math.sin((x+ph*2)*0.8+y*0.4)+Math.sin(y*1.1-ph)*0.5; return nz(w>1.05?[95,155,232]:[46,104,200],r,.06);};
const lavaFn=ph=>(x,y,r)=>{const v=Math.sin(x*0.7+ph)+Math.sin(y*0.6-ph*0.7)+Math.sin((x+y)*0.4+ph*0.5); const t=(v+3)/6;
  return nz(t>0.68?[255,222,90]:t>0.47?[246,132,30]:t>0.28?[205,62,16]:[112,26,10],r,.08);};
makeTile('water',25,waterFn(0));
makeTile('lava',26,lavaFn(0));

// fire texture (4 animation frames stacked)
const fireC=document.createElement('canvas'); fireC.width=16; fireC.height=64; const fctx=fireC.getContext('2d');
for(let f=0;f<4;f++){ const img=fctx.createImageData(16,16); const rr=mulberry32(500+f); const hc=[];
  for(let x=0;x<16;x++)hc.push(4+rr()*7+(x>3&&x<12?4:0));
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){ const h=15-y, i=(y*16+x)*4; if(h<hc[x] && !(h>hc[x]-3&&rr()<.3)){ const t=h/hc[x];
      const c=t<0.35?[255,240,150]:t<0.7?[255,150,30]:[220,60,10]; img.data[i]=c[0];img.data[i+1]=c[1];img.data[i+2]=c[2];img.data[i+3]=255; } }
  fctx.putImageData(img,0,f*16); }

// ================= BLOCKS =================
const CAT={ Soil:{c:'#9be07a'}, Igneous:{c:'#ff9d6e'}, Sedimentary:{c:'#f2cf8a'}, Metamorphic:{c:'#c9a5ff'},
  Mineral:{c:'#8fe4ff'}, Building:{c:'#d0d4dc'}, Fluid:{c:'#7fb6ff'} };
const B=[null]; const ID={};
function addBlock(k,name,cat,fact,tiles,props){
  const o=Object.assign({key:k,name,cat,fact,solid:true,opaque:true,fluid:false,target:true,flammable:false,hidden:false},props||{});
  o.top=TILES[tiles.top||tiles.t]; o.side=TILES[tiles.side||tiles.t]; o.bottom=TILES[tiles.bottom||tiles.t];
  o.id=B.length; B.push(o); ID[k]=o.id;
}
addBlock('grass','Topsoil (Grass)','Soil','The top layer of soil, rich in humus (decayed plants and animals). This is where most plant roots live.',{top:'grass_top',side:'grass_side',bottom:'dirt'});
addBlock('dirt','Soil','Soil','A mix of weathered rock bits, organic matter, water and air. Making just an inch of soil can take hundreds of years.',{t:'dirt'});
addBlock('sand','Sand','Soil','Sand grains are 0.06 to 2 mm across. Most sand is quartz that weathered out of rocks like granite.',{t:'sand'});
addBlock('clay','Clay','Soil','Clay particles are the smallest kind of sediment (under 0.004 mm). They pack tightly, so clay holds water and drains slowly.',{t:'clay'});
addBlock('water','Water','Fluid','Water flows downhill and spreads out. Pour it on fire to put it out. Touch it to lava and the lava cools into obsidian (still lava) or basalt (flowing lava).',{t:'water'},{solid:false,opaque:false,fluid:true,target:false});
addBlock('lava','Lava','Fluid','Molten rock at about 700–1,200 °C. It sets nearby wood, leaves and grass on fire. When it cools it becomes igneous rock.',{t:'lava'},{solid:false,opaque:false,fluid:true,target:false});
addBlock('granite','Granite','Igneous','Intrusive igneous rock. Magma cooled slowly deep underground, which gave the crystals of quartz, feldspar and mica time to grow big.',{t:'granite'});

let sizzleCD=0;
function sizzle(x,y,z){ if(sizzleCD<=0){ sfx('sizzle'); sizzleCD=0.3; } burst(x,y,z,new THREE.Color(0.85,0.85,0.9),6); }
function fluidTick(S,F,M,maxN){
  const list=[]; for(const i of S){ list.push(i); if(list.length>=maxN)break; } for(const i of list)S.delete(i);
  for(const i of list){
    if(world[i]!==F)continue; const x=ix_(i),y=iy_(i),z=iz_(i), L=meta[i];
    if(F===ID.water){ for(const d of DIR6){ const a=x+d[0],b=y+d[1],c=z+d[2], n=get(a,b,c);
        if(n===ID.lava){ setBlock(a,b,c, meta[idx(a,b,c)]===0?ID.obsidian:ID.basalt); sizzle(a,b,c); }
        else if(n===ID.fire){ setBlock(a,b,c,0); sizzle(a,b,c); } } }
    else { let hit=false; for(const d of DIR6){ if(get(x+d[0],y+d[1],z+d[2])===ID.water){hit=true;break;} }
      if(hit){ setBlock(x,y,z, L===0?ID.obsidian:ID.basalt); sizzle(x,y,z); continue; } }
    if(L>0){ let sup=get(x,y+1,z)===F;

      if(!sup){ setBlock(x,y,z,0); continue; } }
    const below=get(x,y-1,z);
    if(y>0 && (below===0||below===ID.fire)){ setBlock(x,y-1,z,F,1); continue; }

}
const MAXFIRE=140;
function tryIgnite(x,y,z){ if(fires.size>=MAXFIRE||!inB(x,y,z))return false; const id=get(x,y,z);
  if(id===0||isFlam(id)){ setBlock(x,y,z,ID.fire); return true; } return false; }
function fireTick(dt){
  const list=[...fires.keys()];
  for(const i of list){
    if(world[i]!==ID.fire){ fires.delete(i); continue; }
    const x=ix_(i),y=iy_(i),z=iz_(i);
    let wet=false; for(const d of DIR6) if(get(x+d[0],y+d[1],z+d[2])===ID.water){wet=true;break;}
    if(wet){ setBlock(x,y,z,0); sizzle(x,y,z); continue; }
    let t=fires.get(i)-dt;
    for(const d of DIR6){ const a=x+d[0],b=y+d[1],c=z+d[2], n=get(a,b,c);
      if(isFlam(n) && rand()<0.07) tryIgnite(a,b,c);
      else if(n===0 && rand()<0.03){ for(const e of DIR6){ if(isFlam(get(a+e[0],b+e[1],c+e[2]))){ tryIgnite(a,b,c); break; } } } }

    const x=ix_(i)+Math.floor(rand()*5)-2, y=iy_(i)+Math.floor(rand()*3)-(rand()<0.3?1:0), z=iz_(i)+Math.floor(rand()*5)-2;

      for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){

let AC=null, noiseBuf=null;
function audioInit(){ if(AC)return; try{ AC=new (window.AudioContext||window.webkitAudioContext)();
  noiseBuf=AC.createBuffer(1,AC.sampleRate*0.4,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; }catch(e){} }
function tone(type,f0,f1,dur,vol,delay){ const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02); }
function noise(freq,dur,vol,type){ const t=AC.currentTime, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=noiseBuf; f.type=type||'bandpass'; f.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t+dur); }
function sfx(k){ if(!AC)return; try{
  if(k==='break')noise(900,0.13,0.5);
  else if(k==='place')tone('square',220,90,0.09,0.1);
  else if(k==='hit'){ noise(400,0.1,0.6,'lowpass'); tone('square',160,70,0.08,0.12); }
  else if(k==='swing')noise(2500,0.08,0.15,'highpass');
  else if(k==='throw'){ tone('triangle',500,180,0.1,0.12); noise(1800,0.06,0.15,'highpass'); }
  else if(k==='whoosh')noise(1400,0.12,0.08,'bandpass');
  else if(k==='catch')tone('square',330,520,0.07,0.08);
  else if(k==='bow'){ tone('triangle',220,110,0.15,0.18); noise(3500,0.12,0.12,'highpass'); }
  else if(k==='thunk')tone('square',140,60,0.05,0.06);
  else if(k==='hurt')tone('sawtooth',300,120,0.2,0.15);
  else if(k==='coin'){ tone('square',988,988,0.06,0.07); tone('square',1319,1319,0.12,0.07,0.06); }
  else if(k==='die')tone('triangle',400,60,0.35,0.2);
  else if(k==='sizzle')noise(3000,0.35,0.25,'highpass');
  else if(k==='buy'){ tone('square',660,660,0.07,0.08); tone('square',880,880,0.07,0.08,0.07); tone('square',1320,1320,0.12,0.08,0.14); }
}catch(e){} }

// ================= TARGETING =================
function lookDir(){ const cp=Math.cos(pitch); return new THREE.Vector3(-Math.sin(yaw)*cp,Math.sin(pitch),-Math.cos(yaw)*cp); }
function raycast(o,d,maxD){
  let x=Math.floor(o.x),y=Math.floor(o.y),z=Math.floor(o.z);
  const sx=d.x>0?1:-1, sy=d.y>0?1:-1, sz=d.z>0?1:-1;
  const tdx=d.x?Math.abs(1/d.x):Infinity, tdy=d.y?Math.abs(1/d.y):Infinity, tdz=d.z?Math.abs(1/d.z):Infinity;
  let tx=d.x?(d.x>0?x+1-o.x:o.x-x)*tdx:Infinity, ty=d.y?(d.y>0?y+1-o.y:o.y-y)*tdy:Infinity, tz=d.z?(d.z>0?z+1-o.z:o.z-z)*tdz:Infinity;
  let t=0, face=[0,0,0];
  while(t<=maxD){
    if(y>=0&&y<H){ const b=get(x,y,z); if(b&&B[b].target) return {x,y,z,face,b,t}; }
    if(tx<ty&&tx<tz){ x+=sx; t=tx; tx+=tdx; face=[-sx,0,0]; }
    else if(ty<tz){ y+=sy; t=ty; ty+=tdy; face=[0,-sy,0]; }
    else { z+=sz; t=tz; tz+=tdz; face=[0,0,-sz]; }
  }
  return null;
}
function rayBox(o,d,e){ let tmin=0,tmax=Infinity; const mn=[e.p[0]-e.hw,e.p[1],e.p[2]-e.hw], mx=[e.p[0]+e.hw,e.p[1]+e.h,e.p[2]+e.hw]; const oo=[o.x,o.y,o.z], dd=[d.x,d.y,d.z];
  for(let a=0;a<3;a++){ if(Math.abs(dd[a])<1e-9){ if(oo[a]<mn[a]||oo[a]>mx[a])return null; continue; }
    let t1=(mn[a]-oo[a])/dd[a], t2=(mx[a]-oo[a])/dd[a]; if(t1>t2){const q=t1;t1=t2;t2=q;} tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax)return null; }
  return tmin; }
let target=null, aimMob=null, aimNPC=false, camDist=0;
function updateTarget(){
  const o=camera.position.clone(), d=lookDir();
  const reach = camMode===1 ? 6 : 6+camDist, mreach = (WP[weapon].ranged?(WP[weapon].range||40):3.6)+(camMode===1?0:camDist);
  target=raycast(o,d,reach);
  let bt=target?target.t:Infinity;
  if(WP[weapon].ranged&&!target){ const far=raycast(o,d,mreach); if(far)bt=far.t; }
  aimMob=null; let best=Math.min(bt,mreach);
  for(const m of mobs){ const t=rayBox(o,d,m); if(t!==null&&t<best){best=t;aimMob=m;} }
  const nt=rayBox(o,d,merchant); aimNPC = !aimMob && nt!==null && nt<Math.min(bt,mreach+1.5);
  $('cross').classList.toggle('mob',!!aimMob);
  if(target&&!aimMob&&!aimNPC){ hl.visible=true; hl.position.set(target.x+0.5,target.y+0.5,target.z+0.5); } else hl.visible=false;
  const lk=$('looking'); let html='';
  if(aimMob) html='⚔️ <b>'+aimMob.t.name+'</b> &nbsp;❤ '+Math.max(0,aimMob.hp)+'/'+aimMob.t.hp;
  else if(aimNPC) html='🧔 <b>Flint the Prospector</b> (tap 🧱 to talk)';
  else if(target){ const b=B[target.b]; html='Looking at: <b>'+b.name+'</b> <span class="badge" style="background:'+CAT[b.cat].c+'">'+b.cat+'</span>'; }
  if(html){ if(lk._h!==html){ lk.innerHTML=html; lk._h=html; } lk.style.display='block'; } else lk.style.display='none';
}

function arrowMesh(mob){ const g=new THREE.Group(); const s=box(0.04,0.04,0.6,mob?boneMat:arrowMatW); g.add(s);
  const t=box(0.07,0.07,0.1,arrowMatT); t.position.z=-0.32; g.add(t); const f=box(0.12,0.02,0.1,lm(0xdddddd)); f.position.z=0.27; g.add(f);

function shoot(w){

// --- boomerang: flies out, curves, comes back to the player's hand
let boom=null;
function throwBoomerang(o,d,w){
  const mesh=boomerangShape(new THREE.Group(),c=>lm(c),false); mesh.scale.setScalar(1.3); scene.add(mesh);
  const side=new THREE.Vector3(-d.z,0,d.x).normalize();
  boom={p:o.clone(),d:d.clone(),side,t:0,out:true,dmg:w.dmg,hit:new Set(),mesh,spin:0,wT:0}; sfx('throw'); refreshHeld();
}
function boomHome(){ return new THREE.Vector3(pl.p[0],pl.p[1]+1.2,pl.p[2]); }
function updateBoomerang(dt){
  if(!boom)return; const b=boom; b.t+=dt;
  const OUT=0.6, SPD=26;
  if(b.out){
    // fast at first, slowing to a stop at the far end, drifting sideways into a curve
    const sp=SPD*Math.max(0.05,1-b.t/OUT);
    b.p.addScaledVector(b.d,sp*dt).addScaledVector(b.side,2*Math.sin(b.t/OUT*Math.PI)*dt);
    if(solidAt(Math.floor(b.p.x),Math.floor(b.p.y),Math.floor(b.p.z))){ burst(b.p.x-0.5,b.p.y-0.5,b.p.z-0.5,new THREE.Color(.7,.5,.3),4); sfx('thunk'); b.out=false; b.hit.clear(); }
    if(b.t>=OUT){ b.out=false; b.hit.clear(); }
  } else {
    const h=boomHome(), to=h.clone().sub(b.p), dist=to.length(), sp=Math.min(24,8+(b.t-OUT)*30);
    if(dist<0.9||b.t>6){ scene.remove(b.mesh); b.mesh.traverse(o=>{ if(o.geometry)o.geometry.dispose(); }); boom=null; sfx('catch'); refreshHeld(); return; }
    b.p.addScaledVector(to.normalize(),Math.min(dist,sp*dt));
  }
  for(const m of mobs){ if(!b.hit.has(m)&&boxHit(m,b.p.x,b.p.y,b.p.z,0.45)){ b.hit.add(m); damageMob(m,b.dmg,m.p[0]-pl.p[0],m.p[2]-pl.p[2],1.5); } }
  b.spin+=dt*22; b.mesh.position.copy(b.p); b.mesh.rotation.set(-Math.PI/2,0,b.spin);
  b.wT-=dt; if(b.wT<=0){ b.wT=0.18; sfx('whoosh'); }
}
function refreshHeld(){ const away=!!boom&&weapon==='boomerang'; tpWeapon.visible=!away; fpWeapon.visible=!away; }
function freeShot(s){ scene.remove(s.mesh); s.mesh.traverse(o=>{ if(o.userData.own)o.geometry.dispose(); }); shots.splice(shots.indexOf(s),1); }
function boxHit(e,x,y,z,pad){ return x>e.p[0]-e.hw-pad&&x<e.p[0]+e.hw+pad&&z>e.p[2]-e.hw-pad&&z<e.p[2]+e.hw+pad&&y>e.p[1]-pad&&y<e.p[1]+e.h+pad; }
function updateShots(dt){
  for(const s of shots.slice()){
    s.life-=dt; if(s.life<=0){ freeShot(s); continue; }
    s.v[1]-=s.grav*dt; let hit=false;
    const steps=4; for(let k=0;k<steps&&!hit;k++){
      s.p[0]+=s.v[0]*dt/steps; s.p[1]+=s.v[1]*dt/steps; s.p[2]+=s.v[2]*dt/steps;
      const [x,y,z]=s.p;
      if(solidAt(Math.floor(x),Math.floor(y),Math.floor(z))){ hit=true; burst(x-0.5,y-0.5,z-0.5,new THREE.Color(.8,.65,.4),4); sfx('thunk'); break; }
      if(s.fromMob){ if(!dead&&boxHit(pl,x,y,z,0.1)){ hit=true; const l=Math.hypot(s.v[0],s.v[2])||1; hurtPlayer(s.dmg,s.v[0]/l*0.6,s.v[2]/l*0.6,'A Skeleton\'s arrow'); } }
      else for(const m of mobs){ if(boxHit(m,x,y,z,0.12)){ hit=true; damageMob(m,s.dmg,s.v[0],s.v[2],4); break; } }
    }
    if(hit){ freeShot(s); continue; }
    s.mesh.position.set(s.p[0],s.p[1],s.p[2]);
    if(s.kind==='arrow'){ tmp.set(s.p[0]+s.v[0],s.p[1]+s.v[1],s.p[2]+s.v[2]); s.mesh.lookAt(tmp); s.mesh.rotateY(Math.PI); }
  }
}
function attackMob(m){
  const w=WP[weapon]; atkCd=w.cd; damageMob(m,w.dmg,m.p[0]-pl.p[0],m.p[2]-pl.p[2],weapon==='granite'?9:6);
}
function damageMob(m,dmg,dx,dz,kb){
  m.hp-=dmg; m.flash=0.15; m.g.bar.visible=true; const l=Math.hypot(dx,dz)||1;
  m.kb[0]=dx/l*kb; m.kb[2]=dz/l*kb; if(m.onGround)m.v[1]=4.5;
  sfx('hit'); burst(m.p[0]-0.5,m.p[1]+m.h*0.3,m.p[2]-0.5,new THREE.Color(1,0.3,0.3),5);

function killMob(m){

  const x=target.x+target.face[0], y=target.y+target.face[1], z=target.z+target.face[2];
  if(!inB(x,y,z))return; const cur=get(x,y,z); if(cur&&B[cur].solid)return;
  if(B[sel].solid && x+1>pl.p[0]-pl.hw && x<pl.p[0]+pl.hw && z+1>pl.p[2]-pl.hw && z<pl.p[2]+pl.hw && y+1>pl.p[1] && y<pl.p[1]+pl.h) return;

function bindHold(el,down,up){
  const on=e=>{ e.preventDefault(); e.stopPropagation(); audioInit(); el.classList.add('down'); down(); };
  const off=e=>{ e.preventDefault(); el.classList.remove('down'); up&&up(); };
  el.addEventListener('touchstart',on,{passive:false}); el.addEventListener('touchend',off); el.addEventListener('touchcancel',off);
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',e=>{ if(el.classList.contains('down'))off(e); });
}

function iconFor(b){

  const draw=(tile,O,u,v,dark)=>{ x.setTransform(u[0]/T,u[1]/T,v[0]/T,v[1]/T,O[0],O[1]);
    x.drawImage(atlas,(tile%COLS)*T,Math.floor(tile/COLS)*T,T,T,0,0,T,T);
    if(dark){x.fillStyle='rgba(0,0,0,'+dark+')';x.fillRect(0,0,T,T);} };
  draw(b.top,[4,12],[16,-8],[16,8],0); draw(b.side,[4,12],[16,8],[0,16],0.18); draw(b.side,[20,20],[16,-8],[0,16],0.32);

const tmp=new THREE.Vector3();
let waterT=0, lavaT=0, fireT=0, spawnT=2, animT=0, animPh=0;
function updatePlayer(dt){
  let ix=joy.x, iz=joy.y;
  if(keys.KeyW||keys.ArrowUp)iz-=1; if(keys.KeyS||keys.ArrowDown)iz+=1; if(keys.KeyA||keys.ArrowLeft)ix-=1; if(keys.KeyD||keys.ArrowRight)ix+=1;
  const m=Math.hypot(ix,iz); if(m>1){ix/=m;iz/=m;}
  const fwd=-iz, str=ix, s=Math.sin(yaw), c=Math.cos(yaw);
  const env=envAt(pl);
  const speed=(fly?(outsideDist()>0?13:9):4.6)*(env.water&&!fly?0.6:1)*(env.lava?0.4:1);
  pl.v[0]=(-s*fwd+c*str)*speed; pl.v[2]=(-c*fwd-s*str)*speed;
  const up=upHeld||keys.Space, down=downHeld||keys.ShiftLeft||keys.ShiftRight;
  if(fly){ pl.v[1]=((up?1:0)-(down?1:0))*7; }
  else if(env.water||env.lava){ pl.v[1]-=9*dt; if(up)pl.v[1]=3.4; if(pl.v[1]<-3.5)pl.v[1]=-3.5; }
  else { pl.v[1]-=28*dt; if(up&&pl.onGround)pl.v[1]=8.6; if(pl.v[1]<-30)pl.v[1]=-30; }
  edgeOpen=true; physStep(pl,dt);
  if(!fly && pl.wall && pl.onGround && m>0.2){
    const dx=(-s*fwd+c*str), dz=(-c*fwd-s*str), l=Math.hypot(dx,dz)||1;
    if(!boxHits(pl.p[0]+dx/l*0.35,pl.p[1]+1.05,pl.p[2]+dz/l*0.35,pl.hw,pl.h)) pl.v[1]=8.6;
  }
  edgeOpen=false;
  // side view: outside the world edge the player flies so they can look at the rock layers
  pl.p[0]=Math.max(-OUT_MAX,Math.min(W+OUT_MAX,pl.p[0])); pl.p[2]=Math.max(-OUT_MAX,Math.min(D+OUT_MAX,pl.p[2]));
  const out=outsideDist();
  if(out>0){ if(!fly){ setFly(true,false); toast('🔭 Side view! You\'re outside the world, so you fly. Look at the layers under the topsoil.'); }
    if(pl.p[1]<-30)pl.p[1]=-30; }
  if(pl.p[1]>H+20)pl.p[1]=H+20;
  // environment damage
  if(env.water) burning=0;
  if(env.lava){ burning=4; hurtPlayer(2,undefined,undefined,'Lava'); }
  else if(env.fire){ burning=Math.max(burning,3); hurtPlayer(1,undefined,undefined,'Fire'); }
  if(burning>0){ burning-=dt; burnT-=dt; if(burnT<=0){ burnT=1; hurtPlayer(1,undefined,undefined,'Fire'); } }
  // regen
  invuln-=dt; sinceHurt+=dt;
  if(sinceHurt>6 && hp<MAXHP){ regenT+=dt; if(regenT>3){ regenT=0; hp++; updateHUD(); } }
  // tint
  const ce=get(Math.floor(camera.position.x),Math.floor(camera.position.y),Math.floor(camera.position.z));
  const tn=$('tint'); if(ce===ID.water){tn.style.background='rgba(30,80,200,.45)';tn.style.opacity=1;} else if(ce===ID.lava){tn.style.background='rgba(255,90,0,.7)';tn.style.opacity=1;} else tn.style.opacity=0;
  hurtFlash=Math.max(0,hurtFlash-dt); $('hurt').style.opacity=(hurtFlash/0.35).toFixed(2);
  $('burn').style.opacity=burning>0?(0.6+Math.sin(performance.now()/80)*0.3).toFixed(2):0;
  return {hs:Math.hypot(pl.v[0],pl.v[2])};
}
function updateMobs(dt){
  for(const m of mobs.slice()){
    const t=m.t, dx=pl.p[0]-m.p[0], dz=pl.p[2]-m.p[2], dy=pl.p[1]-m.p[1], dist=Math.hypot(dx,dz)||0.001;
    if(dist>48){ removeMob(m); continue; }
    if(boxHits(m.p[0],m.p[1],m.p[2],m.hw,m.h)) m.p[1]+=1;
    const env=envAt(m);
    if(!t.fireproof && (env.lava||env.fire)){ m.burnT-=dt; if(m.burnT<=0){ m.burnT=0.5; m.hp-=1; m.flash=0.1; m.g.bar.visible=true; if(m.hp<=0){ killMob(m); continue; } } }
    let mx=0,mz=0; const chase=dist<22&&!dead&&Math.abs(dy)<8;
    const reach=m.hw+pl.hw+0.45;
    if(chase&&t.archer){ m.shootT=(m.shootT===undefined?1.5:m.shootT)-dt;
      if(dist>11){ mx=dx/dist; mz=dz/dist; } else if(dist<5){ mx=-dx/dist; mz=-dz/dist; } else { mx=-dz/dist*0.5; mz=dx/dist*0.5; }
      if(m.shootT<=0&&dist<16&&!paused){ m.shootT=2+rand()*1.2;
        const o=new THREE.Vector3(m.p[0],m.p[1]+1.5,m.p[2]), tg=new THREE.Vector3(pl.p[0],pl.p[1]+1.1,pl.p[2]);
        const fl=o.distanceTo(tg)/22; tg.y+=0.5*7*fl*fl; tg.x+=(rand()-.5)*0.8; tg.z+=(rand()-.5)*0.8;
        const d=tg.sub(o).normalize(); o.addScaledVector(d,0.5);
        if(!raycast(o,d,Math.max(0.1,dist-0.6))){ addShot(o,d,22,7,t.dmg,'arrow',true); m.atk=0.3; sfx('bow'); } else m.shootT=0.6; } }
    else if(chase){ if(dist>reach*0.85){ mx=dx/dist; mz=dz/dist; } }
    else { m.wT-=dt; if(m.wT<=0){ m.wT=2+rand()*3; if(rand()<0.4)m.wander=[0,0]; else { const a=rand()*6.28; m.wander=[Math.sin(a)*0.5,Math.cos(a)*0.5]; } } mx=m.wander[0]; mz=m.wander[1]; }
    if(t.hop){
      if(m.onGround){ m.mv=[0,0]; m.hopT-=dt; if(m.hopT<=0&&(mx||mz)){ m.v[1]=env.water?4:7; m.mv=[mx*t.spd*1.4,mz*t.spd*1.4]; m.hopT=0.5+rand()*0.6; } }
    } else m.mv=[mx*t.spd,mz*t.spd];
    const slow=env.water?0.5:1;
    m.v[0]=m.mv[0]*slow; m.v[2]=m.mv[1]*slow;
    if(env.water){ m.v[1]-=8*dt; if(m.v[1]<1.2&&m.p[1]<SEA)m.v[1]=1.2; } else m.v[1]-=25*dt;
    if(m.v[1]<-30)m.v[1]=-30;
    physStep(m,dt);
    if(!t.hop && m.wall && m.onGround && (mx||mz)) m.v[1]=7.5;
    if(t.climb && m.wall && (mx||mz)) m.v[1]=4;
    if(t.hop && m.wall && !m.onGround) {}
    m.cd-=dt;
    if(chase && !t.archer && dist<reach && dy>-1.8 && dy<m.h+0.2 && m.cd<=0 && !paused){ m.cd=1.1; m.atk=0.3; hurtPlayer(t.dmg,dx/dist,dz/dist,'A '+t.name); }
    // visuals
    if(chase) m.yaw=Math.atan2(-dx,-dz); else if(mx||mz) m.yaw=Math.atan2(-mx,-mz);
    const g=m.g; g.root.position.set(m.p[0],m.p[1],m.p[2]); g.body.rotation.y=m.yaw;
    if(t.hop){ const sq=m.onGround?1:1+Math.max(-0.2,Math.min(0.25,m.v[1]*0.04)); g.body.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq)); }
    else if(t.legs){ m.phase+=dt*Math.hypot(m.v[0],m.v[2])*3; m.atk=Math.max(0,m.atk-dt);
      for(const lg of g.legs){ const ph=m.phase+lg.userData.i*1.6+(lg.userData.sd>0?Math.PI:0); lg.rotation.y=Math.sin(ph)*0.35; lg.rotation.z=Math.max(0,Math.cos(ph))*0.25*lg.userData.sd; }
      g.body.rotation.x=m.atk>0?-0.35:0; }
    else { m.phase+=dt*Math.hypot(m.v[0],m.v[2])*2.5; const a=Math.sin(m.phase)*0.6; g.legL.rotation.x=a; g.legR.rotation.x=-a;
      m.atk=Math.max(0,m.atk-dt);
      if(t.archer&&chase){ g.armL.rotation.x=-1.5; g.armR.rotation.x=m.atk>0?-1.2:-1.5; }
      else { const raise=m.atk>0?-1.8:0; g.armL.rotation.x=-a*0.6+raise; g.armR.rotation.x=a*0.6+raise; } }
    m.flash=Math.max(0,m.flash-dt); for(const mt of g.mats) mt.emissive.setHex(m.flash>0?0xaa0000:mt.userData.e);
    if(g.bar.visible){ g.bar.quaternion.copy(camera.quaternion); g.fg.scale.x=Math.max(0.001,m.hp/t.hp); }
  }
  // spawning
  spawnT-=dt;
  if(spawnT<=0){ spawnT=2.5;
    if(mobsOn && mobs.length<6 && !dead){
      for(let a=0;a<8;a++){
        const ang=rand()*6.28, r=14+rand()*14, x=Math.floor(pl.p[0]+Math.sin(ang)*r), z=Math.floor(pl.p[2]+Math.cos(ang)*r);
        if(x<1||z<1||x>=W-1||z>=D-1)continue; if(Math.hypot(x-MX,z-MZ)<12)continue;
        const s=surfaceAt(x,z); if(s.y<0||!B[s.id].solid||s.id===ID.leaves)continue;
        if(get(x,s.y+1,z)||get(x,s.y+2,z))continue;
        let lavaNear=false; for(const i of lavaSet){ const lx2=ix_(i),lz2=iz_(i); if(Math.abs(lx2-x)<10&&Math.abs(lz2-z)<10){lavaNear=true;break;} }
        const q=rand(); const type=lavaNear&&q<0.5?'magma':q<0.3?'slime':q<0.48?'golem':q<0.68?'spider':q<0.86?'skeleton':'magma';
        spawnMob(type,x+0.5,s.y+1,z+0.5); break;
      }
    }
  }
}
function updateDrops(dt){
  for(let i=drops.length-1;i>=0;i--){ const c=drops[i];
    c.life-=dt; if(c.life<=0){ scene.remove(c.m); drops.splice(i,1); continue; }
    const dx=pl.p[0]-c.p[0], dy=(pl.p[1]+0.8)-c.p[1], dz=pl.p[2]-c.p[2], d=Math.hypot(dx,dy,dz);
    if(d<0.9&&!dead){ coins++; updateHUD(); sfx('coin'); scene.remove(c.m); drops.splice(i,1); queueSave(); continue; }
    if(d<5&&c.life<59.4){ c.p[0]+=dx/d*8*dt; c.p[1]+=dy/d*8*dt; c.p[2]+=dz/d*8*dt; }
    else { c.v[1]-=20*dt; c.p[0]+=c.v[0]*dt; c.p[2]+=c.v[2]*dt; c.p[1]+=c.v[1]*dt; c.v[0]*=0.96; c.v[2]*=0.96;
      if(c.v[1]<0 && solidAt(Math.floor(c.p[0]),Math.floor(c.p[1]-0.2),Math.floor(c.p[2]))){ c.p[1]=Math.floor(c.p[1]-0.2)+1.2; c.v=[0,0,0]; }
      if(solidAt(Math.floor(c.p[0]),Math.floor(c.p[1]),Math.floor(c.p[2])))c.p[1]+=0.5; }
    c.spin+=dt*4; c.m.position.set(c.p[0],c.p[1]+Math.sin(c.spin)*0.06,c.p[2]); c.m.rotation.y=c.spin;
  }
}
function update(dt){
  if(paused){ return; }
  const {hs}=updatePlayer(dt); updateViewRange(dt);
  atkCd-=dt;
  if(hitHeld||placeHeld){ repeatT-=dt; if(repeatT<=0){ repeatT=0.25; if(hitHeld)hitAction(); if(placeHeld)placeAction(); } }

  // player model
  model.position.set(pl.p[0],pl.p[1],pl.p[2]); model.rotation.y=yaw;
  walkPhase+=dt*hs*2.2; const amp=Math.min(1,hs/4)*(pl.onGround||fly?0.7:0.3);
  legL.rotation.x=Math.sin(walkPhase)*amp; legR.rotation.x=-Math.sin(walkPhase)*amp;
  armL.rotation.x=-Math.sin(walkPhase)*amp*0.8; armR.rotation.x=Math.sin(walkPhase)*amp*0.8;
  swingT=Math.max(0,swingT-dt); const sw=swingT>0?Math.sin((1-swingT/0.25)*Math.PI):0;
  if(sw>0) armR.rotation.x=-1.4*sw-0.3;
  head.rotation.x=pitch*0.7; model.visible=camMode===3;
  fpHolder.visible=camMode===1; fpHolder.rotation.x=-sw*1.1; fpHolder.position.y=-0.36+Math.sin(walkPhase)*0.015*amp;

  // camera
  const eye=new THREE.Vector3(pl.p[0],pl.p[1]+EYE,pl.p[2]);
  camera.rotation.set(pitch,yaw,0);
  if(camMode===1){ camera.position.copy(eye); camDist=0; }
  else { const d=lookDir(), right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const want=eye.clone().addScaledVector(d,-4).addScaledVector(right,0.6).add(new THREE.Vector3(0,0.25,0));
    let tt=1; for(let t=0.05;t<=1.0001;t+=0.05){ tmp.lerpVectors(eye,want,t); const b=get(Math.floor(tmp.x),Math.floor(tmp.y),Math.floor(tmp.z)); if(b&&B[b].solid){ tt=Math.max(0,t-0.1); break; } }
    camera.position.lerpVectors(eye,want,tt); camDist=camera.position.distanceTo(eye); }
  camera.updateMatrixWorld();

  // merchant faces player
  const mdx=pl.p[0]-merchant.p[0], mdz=pl.p[2]-merchant.p[2]; if(Math.hypot(mdx,mdz)<12) merchant.g.rotation.y=Math.atan2(-mdx,-mdz);
  const near=nearMerchant(); $('bTalk').style.display=near&&IS_TOUCH?'flex':'none';
  const pr=$('prompt'); if(near&&!IS_TOUCH){ pr.textContent='Press E to talk to Flint'; pr.style.display='block'; } else pr.style.display='none';

  updateMobs(dt); updateShots(dt); updateBoomerang(dt); updateDrops(dt); updateTarget();

  // world sim
  sizzleCD-=dt;
  waterT+=dt; if(waterT>0.2){ waterT=0; fluidTick(activeW,ID.water,4,600); }
  lavaT+=dt; if(lavaT>0.7){ lavaT=0; fluidTick(activeL,ID.lava,2,300); lavaIgnite(); }
  fireT+=dt; if(fireT>0.25){ fireTick(fireT); fireT=0; }

  // particles, clouds
  for(const p of parts){ if(p.life<=0)continue; p.life-=dt; p.v.y-=15*dt; p.m.position.addScaledVector(p.v,dt); if(p.life<=0)p.m.visible=false; }
  for(const c2 of clouds){ c2.position.x+=dt*0.8; if(c2.position.x>140)c2.position.x=-40; }
}
function animate(dt){
  animT+=dt; if(animT>0.14){ animT=0; animPh+=0.35;
    paint(TILES.water,25,waterFn(animPh)); paint(TILES.lava,26,lavaFn(animPh*0.6)); tex.needsUpdate=true;
    fireTex.offset.y=(Math.floor(animPh/0.35)%4)*0.25; }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); animate(dt);
  let n=0; for(const k of dirty){ buildChunk(k%NCX,Math.floor(k/NCX)); dirty.delete(k); if(++n>=4)break; }
  renderer.render(scene,camera); requestAnimationFrame(frame);
}

graniteTex=tileTex('granite'); lavaTex=tileTex('lava');
{ const c=document.createElement('canvas'); c.width=c.height=16; const x=c.getContext('2d'); const r=mulberry32(7);
  for(let yy=0;yy<16;yy++)for(let xx=0;xx<16;xx++){ const v=0.8+r()*0.35; x.fillStyle='rgb('+cl(120*v)+','+cl(88*v)+','+cl(55*v)+')'; x.fillRect(xx,yy,1,1); }
  mudTex=new THREE.CanvasTexture(c); mudTex.magFilter=mudTex.minFilter=THREE.NearestFilter; mudTex.generateMipmaps=false; }
if(!load()) generate((Math.random()*1e9)|0);
edgeOpen=true; unstick(pl); edgeOpen=false; rebuildAll();
select(sel,false); refreshWeapon(); updateHUD();
$('bCam').textContent=camMode===1?'👁 1st':'👁 3rd'; $('bCam').classList.toggle('on',camMode===3);
$('bFly').classList.toggle('on',fly); document.body.classList.toggle('fly',fly);
let seen=false; try{ seen=!!localStorage.getItem('stratacraft_seen2'); localStorage.setItem('stratacraft_seen2','1'); }catch(e){}
if(!seen) openMenu();
window.__sc={pl,mobs,spawnMob,setBlock,get,ID,get coins(){return coins;},set coins(v){coins=v;updateHUD();},get hp(){return hp;},fires,lavaSet,surfaceAt,
  look(y,p){yaw=y;pitch=p;}, hit:hitAction, place:placeAction, select, openShop};
requestAnimationFrame(frame);
})();
